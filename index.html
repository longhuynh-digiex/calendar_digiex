<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <container class="calendar">
      <!-- header -->
      <div class="header">
        <h2 class="month-year">tháng 11 năm 2025</h1>
        <h1 class="date">3</h2>
        <h1 class="dow">Thứ 2</h1>
      </div>

      <!-- calendar view -->
      <div class="table">
        <div class="table__title">
         
            <div class="content">CN</div>
            <div class="content">T2</div>
            <div class="content">T3</div>
            <div class="content">T4</div>
            <div class="content">T5</div>
            <div class="content">T6</div>
            <div class="content">T7</div>
            
           
        </div>
        
      </div>

      <!-- navigator -->
      <div class="nav">
        <div class="nav__items" id="prev-year">&lt&lt</div>
        <div class="nav__items" id="prev-month">&lt</div>
        <div class="nav__items">
          <select name="dates" id="dates-select">
            <!-- <option value="1">1</option> -->
          </select>
        </div>
        <div class="nav__items">
          <span>/</span>
        </div>
        <div class="nav__items">
          <select name="months" id="months-select">
            <!-- <option value="1">1</option> -->
          </select>
        </div>

        <div class="nav__items">
          <span>/</span>
        </div>
        <div class="nav__items">
          <input type="number" id="year-input"/>
        </div>
        <div class="nav__items" id="browse-date">
          <span>OK</span>
        </div>
        <div class="nav__items" id="next-month">&gt</div>
        <div class="nav__items" id="next-year">&gt&gt</div>
        <div class="nav__items" id="current">@</div>
      </div>
    </container>

    <script src="main.js"></script>
  </body>
</html>
